<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style Rewinder - 3D Fashion Mixer</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=Outfit:wght@400;600;700;900&family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Modular Styles -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Background Audio -->
    <audio id="bgm-audio" src="BGM.mp3" preload="auto" loop></audio>

    <!-- Brand UI Overlay (Top Left Header Title & Logo) -->
    <div class="ui-overlay" onclick="showInstructions()" style="cursor: pointer;">
        <img src="Korean Fashion Archive.svg" alt="Korean Fashion Archive" style="display: block; width: 180px; height: auto; margin-bottom: 15px;">
        <svg class="title-svg-interactive" width="280" height="31" viewBox="0 0 482 53" fill="none" xmlns="http://www.w3.org/2000/svg" style="display: block; height: auto;">

            </g>

                <rect x="60.6797" y="41.1641" width="43.0898" height="11.5742" fill="white"/>
            </g>
            <!-- W -->
            <g class="title-char">
                <path d="M131.686 0L141.779 34.0631L154.201 0H166.313L178.735 34.0631L188.828 0H204.744L187.275 52.7383H171.747L160.257 22.1725L148.766 52.7383H133.238L115.77 0H131.686Z" fill="white"/>
            </g>
            <!-- I -->
            <g class="title-char">
                <path d="M231.963 0V52.7383H216.746V0H231.963Z" fill="white"/>
            </g>
            <!-- N -->
            <g class="title-char">
                <path d="M243.965 52.7383V0H259.182L287.288 32.2445V0H302.427V52.7383H287.288L259.182 20.4938V52.7383H243.965Z" fill="white"/>
            </g>
            <!-- D -->
            <g class="title-char">
                <path d="M329.643 41.1275H333.137C335.777 41.1275 338.132 40.7544 340.202 40.0084C342.272 39.2623 344.006 38.2364 345.404 36.9308C346.853 35.6252 347.94 34.0864 348.665 32.3145C349.441 30.4959 349.829 28.5141 349.829 26.3692C349.829 24.2708 349.441 22.3124 348.665 20.4938C347.888 18.6752 346.775 17.1131 345.326 15.8075C343.929 14.5019 342.195 13.476 340.124 12.7299C338.054 11.9839 335.725 11.6108 333.137 11.6108H329.643V41.1275ZM314.426 0H336.941C340.927 0 344.653 0.722761 348.121 2.16828C351.641 3.61381 354.695 5.54894 357.283 7.97369C359.922 10.3518 361.993 13.1496 363.494 16.3671C364.995 19.5379 365.745 22.8719 365.745 26.3692C365.745 29.8198 364.995 33.1538 363.494 36.3712C362.045 39.5421 360 42.3399 357.36 44.7646C354.772 47.1894 351.719 49.1245 348.199 50.57C344.731 52.0155 340.978 52.7383 336.941 52.7383H314.426V0Z" fill="white"/>
            </g>
            <!-- E -->
            <g class="title-char">
                <rect x="377.746" width="43.0898" height="11.5742" fill="white"/>
                <rect x="377.746" y="20.3125" width="43.0898" height="11.5742" fill="white"/>
                <rect x="377.746" y="41.1641" width="43.0898" height="11.5742" fill="white"/>
            </g>
            <!-- R -->
            <g class="title-char">
                <path d="M466.298 23.5714H463.426C460.424 23.5714 458.12 23.0118 456.516 21.8927C454.911 20.7736 454.109 19.1648 454.109 17.0665C454.109 14.9682 454.911 13.3594 456.516 12.2403C458.12 11.1212 460.424 10.5616 463.426 10.5616H466.298V23.5714ZM432.836 52.7383H451.78L466.298 32.4543V52.7383H481.516V0H457.836C454.575 0 451.728 0.442983 449.295 1.32895C446.863 2.16829 444.87 3.33403 443.317 4.82618C441.713 6.31834 440.522 8.04364 439.746 10.0021C438.918 11.9605 438.503 14.0589 438.503 16.2971C438.503 20.3073 439.59 23.5714 441.764 26.0894C443.886 28.5608 447.044 30.2394 451.236 31.1254L432.836 52.7383Z" fill="white"/>
            </g>
        </svg>
    </div>

    <!-- Initial Loading Splash Screen -->
    <div id="loading-screen">
        <div class="splash-logo-container">
            <img src="logo.png" alt="Style Rewinder Logo" class="splash-logo">
        </div>
        <div class="splash-debug-log" id="debug-log"></div>
    </div>

    <!-- Exhibition Instruction Overlay -->
    <div id="instruction-overlay">
        <div class="instruction-card">
            <h1 class="text-3xl font-black mb-8 tracking-wider interactive-hover-title">Style Rewinder<br><span class="text-sm font-bold opacity-60">EXHIBITION GUIDE</span></h1>
            
            <div class="flex flex-col gap-6 text-left mb-10 text-sm">
                <div class="flex items-center gap-4">
                    <div class="step-icon">1</div>
                    <div>
                        <div class="font-black text-white text-base">원통 회전 & 조합</div>
                        <div class="text-xs opacity-70">마우스 드래그로 각 부위별 옷을 회전시켜 패션을 조합하세요.</div>
                    </div>
                </div>

                <div class="flex items-center gap-4">
                    <div class="step-icon">2</div>
                    <div>
                        <div class="font-black text-white text-base">룩북 & 2D 보기</div>
                        <div class="text-xs opacity-70">좌측 휠에서 룩북 세트를 클릭하거나 FLAT 버튼으로 펼쳐보세요.</div>
                    </div>
                </div>

                <div class="flex items-center gap-4">
                    <div class="step-icon">3</div>
                    <div>
                        <div class="font-black text-white text-base">아이템 상세 정보</div>
                        <div class="text-xs opacity-70">원통의 아이템을 클릭하면 화보 및 구매 링크를 확인하실 수 있습니다.</div>
                    </div>
                </div>
            </div>

            <button onclick="closeInstructions()" class="btn-white w-full py-4 text-base font-black tracking-widest shadow-2xl">체험 시작하기</button>
        </div>
    </div>

    <!-- Vignette Darkening Overlay -->
    <div id="vignette-overlay"></div>

    <!-- 3D Three.js Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Top Right Audio Control Button -->
    <button id="audio-control-btn" onclick="toggleAudio()" title="배경음악 켜기/끄기">
        <svg id="volume-icon" viewBox="0 0 24 24">
            <path id="volume-icon-path" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zM3 9v6h4l5 5V4L7 9H3z"/>
        </svg>
    </button>

    <!-- Left Center Vertical Style Selector Wheel -->
    <div id="side-style-wrapper">
        <div class="side-style-header">STYLE</div>
        <div class="side-style-container" id="side-style-container">
            <div class="side-style-list" id="side-style-list">
                <!-- Dynamically Generated Style Items -->
            </div>
        </div>
    </div>

    <!-- Floating Top Management Panel Toggle Button (Hidden in Locked Mode) -->
    <div id="management-btn-wrapper">
        <button class="btn btn-black" onclick="togglePanel(event)">GALLERY</button>
    </div>

    <!-- Management Modal Panel -->
    <div id="management-panel">
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-200">
            <div>
                <h2 class="text-xl font-black text-slate-900 tracking-tight">FASHION MIXER STUDIO</h2>
                <div class="text-[10px] font-extrabold text-slate-400 mt-0.5" id="storage-status"></div>
            </div>
            <div class="flex gap-2">
                <button class="btn btn-black py-2 px-4 text-[10px]" onclick="saveToShareableFile()">내보내기 (HTML)</button>
                <button class="btn py-2 px-3 text-[10px] text-slate-500 hover:text-slate-900" onclick="togglePanel(event)">닫기 ✕</button>
            </div>
        </div>

        <div id="category-controls">
            <!-- Dynamically Generated Gallery & Item Controls -->
        </div>

        <div class="mt-8 pt-6 border-t border-slate-200">
            <div class="flex justify-between items-center mb-3">
                <span class="font-black text-xs text-slate-800 uppercase tracking-wider">STYLE SET LOOKBOOK</span>
                <button onclick="addStyleSet()" class="text-[10px] font-black text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-lg hover:bg-indigo-100 transition-colors">+ NEW SET</button>
            </div>
            <div id="set-settings-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                <!-- Dynamically Generated Style Set Managers -->
            </div>
        </div>
    </div>

    <!-- Bottom Controls -->
    <div class="controls">
        <button class="btn" onclick="showSetReference()">STYLE</button>
        <button class="btn" onclick="randomize()">SHUFFLE</button>
        <button class="btn" id="flat-view-btn" onclick="toggleFlatView()">FLAT</button>
    </div>

    <!-- Info Popup Modal -->
    <div id="info-popup">
        <div class="info-card">
            <div class="close-info" onclick="closeInfoPopup()">×</div>
            <a id="info-img-link" target="_blank" class="popup-image-container">
                <div class="info-visual">
                    <img id="info-img" src="" alt="Fashion Item">
                </div>
                <div class="buy-overlay" id="info-buy-overlay">
                    <span>SHOP ITEM ↗</span>
                </div>
            </a>
            <div class="info-body">
                <div id="info-category" class="info-tag">CATEGORY</div>
                <div id="info-title">ITEM NAME</div>
                <div id="info-desc"></div>
                <a id="info-link" href="#" target="_blank" class="btn btn-black w-full mt-4 text-center block text-xs font-black">구매 페이지 방문하기 ↗</a>
            </div>
        </div>
    </div>

    <!-- Hover Tooltip Hint -->
    <div id="info-hint">눌러보세요!</div>

    <!-- Toast Notification Message Box -->
    <div id="message-box"></div>

    <!-- Modular Script -->
    
    <script src="script.js"></script>
</body>

</html>
